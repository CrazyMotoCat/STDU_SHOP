name: CI locked toolchain
description: Install pinned tools and locked dependencies without service startup
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.25.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .node-version
        cache: pnpm
    - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      with:
        version: 0.13.3
        python-version: '3.14.3'
        enable-cache: true
        cache-dependency-glob: services/ingestion/uv.lock
    - shell: bash
      run: |
        pnpm env:init
        pnpm install --frozen-lockfile
        uv sync --project services/ingestion --locked
        pnpm toolchain:check
