name: FAST CI

on:
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        edited,
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript static and units
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - name: Lint, format, types, units, policy and hygiene
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          pnpm exec eslint . --max-warnings 0
          pnpm exec prettier --check .
          pnpm -r typecheck
          pnpm exec vitest run
          node --test scripts/ci/*.node.mjs
          node scripts/ci/hygiene.mjs

  python:
    name: Python static and parser
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - name: Ruff, mypy and parser/FastAPI units
        run: |
          uv run --project services/ingestion --locked ruff check services/ingestion scripts/windows_job.py
          uv run --project services/ingestion --locked ruff format --check services/ingestion scripts/windows_job.py
          uv run --project services/ingestion --locked mypy --config-file services/ingestion/pyproject.toml services/ingestion/src services/ingestion/tests
          uv run --project services/ingestion --locked mypy --platform win32 --check-untyped-defs scripts/windows_job.py
          uv run --project services/ingestion --locked pytest services/ingestion/tests
      - name: WB laboratory offline safety tests (no Docker or SSH)
        run: |
          uv run --project services/ingestion --locked ruff check experiments/wb-lab-01
          uv run --project services/ingestion --locked ruff format --check experiments/wb-lab-01
          python3 -B -m unittest discover -s experiments/wb-lab-01
          sudo -n python3 -B -m unittest discover -s experiments/wb-lab-01 -p test_runtime_e0b.py -k test_sentinel_umask_and_uid_999
      - name: E2 and E3 disposable PostgreSQL invariants
        run: |
          docker image pull --platform linux/amd64 docker.io/library/postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
          WB_E2_REAL_PG=1 WB_E34_REAL_PG=1 python3 -B -m unittest discover -s experiments/wb-lab-01 -p test_e2.py -k E2Postgres

  contracts:
    name: Frozen contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: pnpm db:validate
      - run: bash scripts/ci/contracts.sh

  fast-gate:
    name: FAST CI
    if: ${{ always() }}
    needs: [javascript, python, contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Require every FAST component
        env:
          FAST_RESULTS: '{"javascript":"${{ needs.javascript.result }}","python":"${{ needs.python.result }}","contracts":"${{ needs.contracts.result }}"}'
        run: node scripts/ci/merge-gate.mjs --fast
