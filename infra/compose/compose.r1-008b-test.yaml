services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: stdu_r1_008b_test
      POSTGRES_PASSWORD: ${R1_008B_TEST_PG_PASSWORD:?Set a generated disposable password}
    ports:
      - 127.0.0.1:${R1_008B_TEST_PG_PORT:?Set a reserved disposable loopback port}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d stdu_r1_008b_test']
      interval: 1s
      timeout: 2s
      retries: 60
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    restart: 'no'

  redis:
    image: redis:8.10.1-alpine3.23
    environment:
      R1_008B_TEST_REDIS_PASSWORD: ${R1_008B_TEST_REDIS_PASSWORD:?Set a generated disposable password}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$R1_008B_TEST_REDIS_PASSWORD" --appendonly no --save ""
    ports:
      - 127.0.0.1:${R1_008B_TEST_REDIS_PORT:?Set a reserved disposable loopback port}:6379
    tmpfs:
      - /data:rw,noexec,nosuid,size=128m
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$R1_008B_TEST_REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 1s
      timeout: 2s
      retries: 60
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: 'no'

volumes:
  postgres-data:
