services:
  process-observer:
    profiles: [diagnostics]
    image: golang:1.25.4-alpine@sha256:d3f0cf7723f3429e3f9ed846243970b20a2de7bae6a5b66fc5914e228d831bbb
    pid: host
    user: '65534:65534'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 64m
    cpus: 0.25
    restart: 'no'

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: stdu_r1_010d_test
      POSTGRES_PASSWORD: ${R1_010D_PG_PASSWORD:?Set a generated disposable password}
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=1536m
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d stdu_r1_010d_test']
      interval: 1s
      timeout: 2s
      retries: 90
    restart: 'no'
    networks: [database]

  redis:
    image: redis:8.10.1-alpine3.23
    environment:
      R1_010D_REDIS_PASSWORD: ${R1_010D_REDIS_PASSWORD:?Set a generated disposable password}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$R1_010D_REDIS_PASSWORD" --appendonly yes --appendfsync always --save ""
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$R1_010D_REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 1s
      timeout: 2s
      retries: 45
    restart: 'no'
    networks: [application]

  clamav-seed:
    image: clamav/clamav:1.4.6@sha256:982e28f90061d0e66eb03276419f589a47c9fa601e985e472fc2f6c64b497ca0
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        test -s /var/lib/clamav/main.cvd -o -s /var/lib/clamav/main.cld;
        sed -e 's|^\(TestDatabases \)|#\1|' -e '$$a TestDatabases no'
        -e 's|^\(NotifyClamd \)|#\1|' /etc/clamav/freshclam.conf
        > /tmp/freshclam_initial.conf;
        freshclam --foreground --stdout --config-file=/tmp/freshclam_initial.conf;
        rm -f /tmp/freshclam_initial.conf;
        mkdir -p /signature-seed;
        cp -a /var/lib/clamav/. /signature-seed/;
        chown -R clamav:clamav /signature-seed
    volumes:
      - clam_signatures:/signature-seed
    mem_limit: 256m
    cpus: 0.25
    restart: 'no'
    networks: [clamav_seed, signature_egress]

  clamav:
    labels:
      com.stdu.r1-010d.boundary-owner: ${R1_010D_BOUNDARY_OWNER:?Set the per-run boundary owner token}
    build:
      context: ../..
      dockerfile: infra/compose/r1-010d-clamav.Dockerfile
    image: ${R1_010D_CLAMAV_IMAGE:?Set the task-owned scanner image}
    depends_on:
      clamav-seed:
        condition: service_completed_successfully
    environment:
      CLAMAV_NO_MILTERD: 'true'
      SCAN_RESOURCE_BIND: ${R1_010D_SCANNER_IP:?Set the private scanner address}
      CLAMD_STARTUP_TIMEOUT: '900'
      FRESHCLAM_CHECKS: '24'
      FRESHCLAM_CONF_Checks: '24'
      CLAMD_CONF_MaxThreads: '1'
      CLAMD_CONF_StreamMaxLength: 64M
      CLAMD_CONF_MaxFileSize: 64M
      CLAMD_CONF_MaxScanSize: 256M
      CLAMD_CONF_MaxRecursion: '10'
      CLAMD_CONF_MaxFiles: '10000'
      CLAMD_CONF_PCREMaxFileSize: 64M
      CLAMD_CONF_MaxScanTime: '120000'
      CLAMD_CONF_AlertExceedsMax: 'yes'
      CLAMD_CONF_AlertEncrypted: 'yes'
      CLAMD_CONF_LogTime: 'no'
    volumes:
      - clam_signatures:/var/lib/clamav
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=536870912
    mem_reservation: 4g
    mem_limit: 6g
    cpus: 1.0
    cgroup: private
    healthcheck:
      test:
        [
          CMD-SHELL,
          'clamdscan --ping=3 --no-summary --config-file=/etc/clamav/clamd.conf',
        ]
      interval: 10s
      timeout: 5s
      start_period: 15m
      retries: 6
    restart: 'no'
    networks:
      scanner_internal:
        ipv4_address: ${R1_010D_SCANNER_IP:?Set the private scanner address}
      signature_egress: {}

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: ${R1_010D_API_IMAGE:-stdu-r1-010d-api-test:local}
    environment:
      NODE_ENV: production
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: '3001'
      STAFF_CONTAINER_BIND: loopback
      STAFF_ORIGINS: http://127.0.0.1:3000
      COOKIE_PROFILE: loopback
      STAFF_DATABASE_URL: postgresql://stdu_runtime:${R1_010D_RUNTIME_PASSWORD:?Set a generated runtime password}@postgres:5432/stdu_r1_010d_test
      REDIS_URL: redis://default:${R1_010D_REDIS_PASSWORD:?Set a generated Redis password}@redis:6379/0
      SESSION_HMAC_KEY: ${R1_010D_SESSION_HMAC_KEY:?Set a generated HMAC key}
      RATE_LIMIT_KEY: ${R1_010D_RATE_LIMIT_KEY:?Set a generated rate key}
      INQUIRY_PUBLIC_ENABLED: 'true'
      INQUIRY_UPLOAD_PROFILE: ${R1_010D_UPLOAD_PROFILE:-MVP_SAFE}
      FILE_STORAGE_ROOT: /data/files
      SCAN_STREAM_ENABLED: 'true'
      SCAN_STREAM_HOST: ${R1_010D_API_STREAM_IP:-172.31.255.242}
      SCAN_STREAM_PORT: '9011'
    volumes:
      - inquiry_files:/data/files
    mem_limit: 1g
    cpus: 0.5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: 'no'
    networks:
      database: {}
      application: {}
      scan_stream:
        ipv4_address: ${R1_010D_API_STREAM_IP:?Set an address inside the disposable scan stream subnet}

  scan-worker:
    image: ${R1_010D_API_IMAGE:-stdu-r1-010d-api-test:local}
    command: [node, dist/scan-worker/main.js]
    environment:
      NODE_ENV: production
      APP_ENV: test
      SCAN_TEST_DEADLINE_MS: ${R1_010D_SCAN_DEADLINE_MS:-180000}
      SCAN_DATABASE_URL: postgresql://stdu_scan_worker_test:${R1_010D_WORKER_PASSWORD:?Set a generated worker password}@postgres:5432/stdu_r1_010d_test
      CLAMD_HOST: ${R1_010D_CLAMD_HOST:-clamav}
      CLAMD_PORT: '3310'
      SCAN_API_HOST: ${R1_010D_API_STREAM_IP:-172.31.255.242}
      SCAN_API_PORT: '9011'
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      clamav:
        condition: service_healthy
    mem_limit: 1g
    cpus: 0.5
    restart: 'no'
    healthcheck:
      test: [CMD, node, dist/scan-worker/healthcheck.js]
      interval: 15s
      timeout: 20s
      start_period: 15m
      retries: 3
    networks: [database, scanner_internal, scan_stream]

  scan-stall:
    image: ${R1_010D_API_IMAGE:-stdu-r1-010d-api-test:local}
    command: [node, dist/scan-worker/test-clamd-stall.js]
    environment:
      NODE_ENV: production
      R1_010D_FAKE_PROBE_FAIL_AFTER_SCAN: ${R1_010D_FAKE_PROBE_FAIL_AFTER_SCAN:-false}
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const s=require('net').connect(3310,'127.0.0.1');s.on('connect',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),1000)",
        ]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: 'no'
    networks: [scanner_internal]

  r1-test-runner:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: build
    image: ${R1_010D_RUNNER_IMAGE:?Set the task-owned runtime-test image}
    command: [node, -e, 'setInterval(() => {}, 2147483647)']
    environment:
      NODE_ENV: test
      STDU_RUNTIME_PASSWORD: ${R1_010D_RUNTIME_PASSWORD:?Set a generated runtime password}
      MIGRATION_DATABASE_URL: postgresql://postgres:${R1_010D_PG_PASSWORD:?Set a generated disposable password}@postgres:5432/stdu_r1_010d_test
      STAFF_DATABASE_URL: postgresql://stdu_runtime:${R1_010D_RUNTIME_PASSWORD:?Set a generated runtime password}@postgres:5432/stdu_r1_010d_test
      SCAN_DATABASE_URL: postgresql://stdu_scan_worker_test:${R1_010D_WORKER_PASSWORD:?Set a generated worker password}@postgres:5432/stdu_r1_010d_test
      SCAN_OPERATOR_DATABASE_URL: postgresql://stdu_scan_operator_test:${R1_010D_OPERATOR_PASSWORD:?Set a generated operator password}@postgres:5432/stdu_r1_010d_test
      R1_010D_TEST_REDIS_URL: redis://default:${R1_010D_REDIS_PASSWORD:?Set a generated Redis password}@redis:6379/0
      R1_010D_API_URL: http://api:3001
      R1_010D_TEST_RUN_ID: ${R1_010D_TEST_RUN_ID:?Set a generated runtime test identifier}
      R1_010D_UPLOAD_PROFILE: ${R1_010D_UPLOAD_PROFILE:-MVP_SAFE}
    mem_limit: 2g
    cpus: 1.0
    restart: 'no'
    networks: [database, application]

networks:
  database:
    internal: true
    ipam:
      config:
        - subnet: ${R1_010D_DATABASE_SUBNET:?Set an available disposable database subnet}
  application:
    internal: true
    ipam:
      config:
        - subnet: ${R1_010D_APPLICATION_SUBNET:?Set an available disposable application subnet}
  scanner_internal:
    internal: true
    ipam:
      config:
        - subnet: ${R1_010D_SCANNER_SUBNET:?Set an available disposable scanner subnet}
  scan_stream:
    internal: true
    ipam:
      config:
        - subnet: ${R1_010D_SCAN_STREAM_SUBNET:?Set an available disposable scan stream subnet}
  signature_egress:
    ipam:
      config:
        - subnet: ${R1_010D_SIGNATURE_EGRESS_SUBNET:?Set an available disposable signature egress subnet}
  clamav_seed:
    internal: true
    ipam:
      config:
        - subnet: ${R1_010D_CLAMAV_SEED_SUBNET:?Set an available disposable ClamAV seed subnet}

volumes:
  inquiry_files:
  clam_signatures:
