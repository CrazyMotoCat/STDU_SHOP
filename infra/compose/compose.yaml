services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm env:init}
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm env:init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:8.10.1-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run pnpm env:init}
    command:
      [
        sh,
        -c,
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly no --save ""',
      ]
    networks: [backend]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?Run pnpm env:init}
      NODE_ENV: production
      STAFF_CONTAINER_BIND: loopback
      HOST: 0.0.0.0
      PORT: '3001'
      DATABASE_URL: ${STAFF_COMPOSE_DATABASE_URL:?Run pnpm env:init and provision stdu_runtime}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY:?Run pnpm env:init}
      RATE_LIMIT_KEY: ${RATE_LIMIT_KEY:?Run pnpm env:init}
      STAFF_ORIGINS: ${STAFF_ORIGINS:?Set exact staff browser origins}
      COOKIE_PROFILE: ${COOKIE_PROFILE:?Run pnpm env:init}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-}
      TRUSTED_PROXY_ADDRESS: ${TRUSTED_PROXY_ADDRESS:-}
      FILE_STORAGE_ROOT: /data/files
      INGESTION_INTERNAL_URL: http://ingestion:8000
    ports: ['127.0.0.1:3001:3001']
    volumes: [private-files:/data/files]
    networks: [backend]
    mem_limit: 512m
    cpus: 1
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 8s
      retries: 15
      start_period: 15s
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
    networks: [backend]
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=6)",
        ]
      interval: 5s
      timeout: 8s
      retries: 15
      start_period: 15s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
    ports: ['127.0.0.1:3000:3000']
    networks: [backend]
    mem_limit: 512m
    cpus: 1
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 8s
      retries: 15
      start_period: 15s

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  private-files:
