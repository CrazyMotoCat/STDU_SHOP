services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: stdu_r1_010c_e2e
      POSTGRES_PASSWORD: ${R1_010C_TEST_PG_PASSWORD:?Set a generated disposable password}
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=768m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d stdu_r1_010c_e2e']
      interval: 1s
      timeout: 2s
      retries: 60
    restart: 'no'

  redis:
    image: redis:8.10.1-alpine3.23
    environment:
      R1_010C_TEST_REDIS_PASSWORD: ${R1_010C_TEST_REDIS_PASSWORD:?Set a generated disposable password}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$R1_010C_TEST_REDIS_PASSWORD" --save "" --appendonly no
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$R1_010C_TEST_REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 1s
      timeout: 2s
      retries: 60
    restart: 'no'

  e2e-runner:
    build:
      context: ../..
      dockerfile: infra/docker/r1-010c-e2e.Dockerfile
    init: true
    environment:
      R1_010C_TEST_PG_PASSWORD: ${R1_010C_TEST_PG_PASSWORD:?Set a generated disposable password}
      R1_010C_TEST_REDIS_PASSWORD: ${R1_010C_TEST_REDIS_PASSWORD:?Set a generated disposable password}
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    shm_size: 1gb
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1024m
    restart: 'no'
