[project]
name = "stdu-ingestion"
version = "0.1.0"
description = "Internal extraction service foundation; no business commands in R1-001"
requires-python = "==3.14.3"
dependencies = [
  "fastapi==0.153.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1", "mypy==1.19.1"]

[build-system]
requires = ["uv_build==0.13.3"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ingestion"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
